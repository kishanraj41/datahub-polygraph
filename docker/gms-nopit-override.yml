# Fallback override: stop GMS creating point-in-time snapshots for graph queries.
#
# Use only if docker/gms-search-override.yml (ELASTICSEARCH_IMPLEMENTATION=opensearch)
# does not clear the `Failed to generate PointInTime Identifier` 500.
#
# This is the blunter fix. Point-in-time gives a lineage query a consistent view
# of the index while it pages; turning it off means a very large lineage graph
# being written to concurrently could page inconsistently. For a four-dataset
# demo catalog that is not a real risk, but it is a correctness trade and should
# not be presented as equivalent to the dialect fix above.
#
# Applied by:  scripts\fix_gms_search.ps1 -Mode nopit

services:
  datahub-gms:
    environment:
      ELASTICSEARCH_SEARCH_GRAPH_POINT_IN_TIME_CREATION_ENABLED: "false"
